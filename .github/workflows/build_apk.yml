name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      - name: Bootstrap Flutter Android app if needed
        run: |
          if [ ! -d calculadora_bcv_flutter/android ]; then
            flutter create --template app /tmp/flutter_app --platforms=android --project-name calculadora_bcv_flutter --no-pub
            cp -r /tmp/flutter_app/android calculadora_bcv_flutter/
            cp /tmp/flutter_app/.gitignore calculadora_bcv_flutter/
          fi

      - name: Cache Flutter pub packages
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('calculadora_bcv_flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get Flutter dependencies
        working-directory: calculadora_bcv_flutter
        run: flutter pub get

      - name: Build release APK
        working-directory: calculadora_bcv_flutter
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: calculadora_bcv_flutter/build/app/outputs/flutter-apk/*.apk
